<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>グミ精霊 所持チェックリスト</title>
<style>
  :root{
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --panel-border: #2a313c;
    --text: #e6edf3;
    --muted: #b7c0cc;
    --accent: #4f8cff;
    --danger: #f04747;
    --gap: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom:40px;
  }
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--panel);
    border-bottom:1px solid var(--panel-border);
    padding:10px 12px 0 12px;
  }
  h1{
    font-size:1.05rem;
    margin:2px 0 10px 0;
    text-align:center;
  }
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .tab{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:10px 6px;
    border-radius:10px 10px 0 0;
    background:#0d1117;
    color:var(--muted);
    font-size:0.95rem;
    border:1px solid var(--panel-border);
    border-bottom:none;
    min-height:44px;
  }
  .tab.active{
    background:var(--panel);
    color:var(--text);
    font-weight:700;
    border-color:var(--accent);
  }
  .tab-name{
    max-width:9em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .edit-name-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    min-width:28px;
    border-radius:50%;
    background:transparent;
    color:inherit;
    border:1px solid currentColor;
    font-size:0.85rem;
    opacity:0.8;
  }
  .progress-wrap{
    padding:10px 12px 12px 12px;
  }
  .progress-headline{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .progress-headline .count{
    font-size:1.3rem;
    font-weight:800;
  }
  .progress-bar-track{
    width:100%;
    height:10px;
    border-radius:6px;
    background:#22272e;
    overflow:hidden;
    margin-bottom:8px;
  }
  .progress-bar-fill{
    height:100%;
    background:linear-gradient(90deg,#4f8cff,#7c3aed);
    width:0%;
    transition:width 0.25s ease;
  }
  .breakdown{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .breakdown-chip{
    font-size:0.78rem;
    padding:3px 8px;
    border-radius:999px;
    background:#22272e;
    color:var(--muted);
    border:1px solid var(--panel-border);
  }
  .celebrate{
    display:none;
    background:linear-gradient(90deg,#eab308,#f04747);
    color:#1a1200;
    font-weight:800;
    text-align:center;
    padding:8px;
    border-radius:8px;
    margin-bottom:8px;
    font-size:0.95rem;
  }
  .celebrate.show{
    display:block;
  }
  .reset-btn{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--danger);
    background:transparent;
    color:var(--danger);
    font-size:0.9rem;
    min-height:44px;
  }
  main{
    padding:10px 12px 0 12px;
  }
  .rarity-section{
    margin-bottom:18px;
  }
  .rarity-heading{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.95rem;
    border-left:4px solid;
    padding-left:8px;
    margin:0 0 8px 0;
  }
  .rarity-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    display:none;
  }
  .rarity-count{
    margin-left:auto;
    color:var(--muted);
    font-weight:700;
    font-size:0.85rem;
  }
  .card-list{
    display:flex;
    flex-direction:column;
    gap:var(--gap);
  }
  .card{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:12px;
    min-height:44px;
  }
  .card input.check{
    position:absolute;
    opacity:0;
    width:1px;
    height:1px;
  }
  .check-visual{
    flex:none;
    width:30px;
    height:30px;
    border-radius:8px;
    border:2px solid var(--muted);
    background:transparent;
    position:relative;
    margin-top:2px;
  }
  .card input.check:checked + .check-visual{
    background:var(--accent);
    border-color:var(--accent);
  }
  .card input.check:checked + .check-visual::after{
    content:"";
    position:absolute;
    left:9px;
    top:4px;
    width:8px;
    height:15px;
    border-right:3px solid #fff;
    border-bottom:3px solid #fff;
    transform:rotate(40deg);
  }
  .card.checked{
    opacity:0.6;
  }
  .card-body{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .card-top{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .jp-name{
    font-weight:700;
    font-size:1.02rem;
  }
  .badge{
    font-size:0.72rem;
    padding:2px 8px;
    border-radius:999px;
    font-weight:700;
    white-space:nowrap;
  }
  .en-name{
    font-size:0.82rem;
    color:var(--muted);
    font-style:italic;
  }
  .how{
    font-size:0.85rem;
    color:var(--muted);
    margin-top:2px;
    line-height:1.4;
  }
  footer{
    padding:16px 12px 8px 12px;
    text-align:center;
    font-size:0.72rem;
    color:var(--muted);
    line-height:1.6;
  }
</style>

<script>
(function(){
  var SPRITES = [{"jp": "グミの水の精霊", "en": "Gummy Water Sprite", "category": "Rare", "how": "水辺で入手・水中シールド回復＋ダスト+10%"}, {"jp": "グミの地の精霊", "en": "Gummy Earth Sprite", "category": "Rare", "how": "森で入手・宝箱レア率UP"}, {"jp": "グミの炎の精霊", "en": "Gummy Fire Sprite", "category": "Rare", "how": "都市部POIで入手・被ダメ後爆発"}, {"jp": "グミのフィッシュ精霊", "en": "Gummy Fishy Sprite", "category": "Rare", "how": "釣り・水場・遊泳で入手・移動速度UP"}, {"jp": "グミの風の精霊", "en": "Gummy Air Sprite", "category": "Rare", "how": "高所山岳・ダッシュで入手・ジャンプ強化＋落下無効"}, {"jp": "グミのストライカー精霊", "en": "Gummy Striker Sprite", "category": "Epic", "how": "精霊宝箱・サッカーゴール・よじ登りで入手・オーバードライブ"}, {"jp": "グミのオーラ精霊", "en": "Gummy Aura Sprite", "category": "Epic", "how": "精霊宝箱限定で入手・一定ダメ後ショック"}, {"jp": "グミのダック精霊", "en": "Gummy Duck Sprite", "category": "Epic", "how": "保管庫（Sinister Strip等）で入手・エモート中シールド回復"}, {"jp": "グミのゴースト精霊", "en": "Gummy Ghost Sprite", "category": "Epic", "how": "夜間に各地で入手・リロード中透明化"}, {"jp": "グミの悪魔の精霊", "en": "Gummy Demon Sprite", "category": "Epic", "how": "精霊宝箱・レア宝箱で入手・撃破時HP回復"}, {"jp": "グミの王様の精霊", "en": "Gummy King Sprite", "category": "Epic", "how": "精霊宝箱・AIボット撃破で入手・ツルハシダメ増"}, {"jp": "グミのパンク精霊", "en": "Gummy Punk Sprite", "category": "Legendary", "how": "キーカード保管庫宝箱で入手・Lv5で弾薬無限"}, {"jp": "グミの夢の精霊", "en": "Gummy Dream Sprite", "category": "Legendary", "how": "保管庫内精霊宝箱で入手・レベル毎レジェンド戦利品"}, {"jp": "グミのボス精霊", "en": "Gummy Boss Sprite", "category": "Legendary", "how": "ボス撃破・保管庫宝箱で入手・最大HP増"}, {"jp": "グミのセブン精霊", "en": "Gummy Seven Sprite", "category": "Legendary", "how": "高所山岳で入手・敵の足跡表示"}, {"jp": "グミの死神の精霊", "en": "Gummy Grim Sprite", "category": "Mythic", "how": "精霊宝箱（激レア）で入手・攻撃者マーク"}, {"jp": "グミのゼロポイントの精霊", "en": "Gummy Zero Point Sprite", "category": "Mythic", "how": "保管庫精霊宝箱（超激レア）で入手・回復時シールドバブルJr"}, {"jp": "グミのバットマン精霊", "en": "Gummy Batman Sprite", "category": "Mythic", "how": "精霊宝箱（激レア）コラボ限定で入手・グライダー再展開"}];
  var CATEGORY_ORDER = ["Rare", "Epic", "Legendary", "Mythic"];
  var STORAGE_PREFIX = "fnGummyChecklist_v1_";
  var players = ["p1", "p2"];
  var defaultNames = {p1:"プレイヤー1", p2:"プレイヤー2"};
  var activePlayer = "p1";

  function nameKey(p){ return STORAGE_PREFIX + p + "_name"; }
  function checksKey(p){ return STORAGE_PREFIX + p + "_checks"; }

  function loadName(p){
    var v = localStorage.getItem(nameKey(p));
    return v && v.length > 0 ? v : defaultNames[p];
  }
  function saveName(p, name){
    localStorage.setItem(nameKey(p), name);
  }
  function loadChecks(p){
    var raw = localStorage.getItem(checksKey(p));
    if(!raw) return {};
    try{ return JSON.parse(raw); }catch(e){ return {}; }
  }
  function saveChecks(p, obj){
    localStorage.setItem(checksKey(p), JSON.stringify(obj));
  }

  function renderTabNames(){
    players.forEach(function(p){
      document.getElementById("tabName-" + p).textContent = loadName(p);
    });
  }

  function renderProgress(){
    var checks = loadChecks(activePlayer);
    var totalChecked = 0;
    var byCategory = {};
    CATEGORY_ORDER.forEach(function(c){ byCategory[c] = {done:0, total:0}; });
    SPRITES.forEach(function(sp){
      var id = sp.en.toLowerCase().split(" ").join("-");
      byCategory[sp.category].total += 1;
      if(checks[id]){
        totalChecked += 1;
        byCategory[sp.category].done += 1;
      }
    });
    document.getElementById("totalChecked").textContent = totalChecked;
    var pct = SPRITES.length ? Math.round((totalChecked / SPRITES.length) * 100) : 0;
    document.getElementById("progressFill").style.width = pct + "%";

    var breakdownEl = document.getElementById("breakdown");
    breakdownEl.innerHTML = "";
    CATEGORY_ORDER.forEach(function(c){
      var chip = document.createElement("span");
      chip.className = "breakdown-chip";
      chip.textContent = c + " " + byCategory[c].done + "/" + byCategory[c].total;
      breakdownEl.appendChild(chip);
      var countEl = document.querySelector('[data-category-count="' + c + '"]');
      if(countEl){ countEl.textContent = byCategory[c].done + "/" + byCategory[c].total; }
    });

    var celebrateEl = document.getElementById("celebrate");
    if(totalChecked === SPRITES.length){
      celebrateEl.classList.add("show");
    }else{
      celebrateEl.classList.remove("show");
    }
  }

  function renderChecks(){
    var checks = loadChecks(activePlayer);
    document.querySelectorAll(".card").forEach(function(card){
      var id = card.getAttribute("data-id");
      var input = card.querySelector("input.check");
      var isChecked = !!checks[id];
      input.checked = isChecked;
      card.classList.toggle("checked", isChecked);
    });
  }

  function switchPlayer(p){
    activePlayer = p;
    document.querySelectorAll(".tab").forEach(function(tab){
      tab.classList.toggle("active", tab.getAttribute("data-player") === p);
    });
    renderChecks();
    renderProgress();
  }

  function bindTabs(){
    document.querySelectorAll(".tab").forEach(function(tab){
      tab.addEventListener("click", function(e){
        if(e.target.classList.contains("edit-name-btn")) return;
        switchPlayer(tab.getAttribute("data-player"));
      });
    });
    document.querySelectorAll(".edit-name-btn").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var p = btn.getAttribute("data-player");
        var current = loadName(p);
        var next = window.prompt("プレイヤー名を入力してください", current);
        if(next !== null && next.trim().length > 0){
          saveName(p, next.trim());
          renderTabNames();
        }
      });
    });
  }

  function bindCards(){
    document.querySelectorAll("input.check").forEach(function(input){
      input.addEventListener("change", function(){
        var id = input.getAttribute("data-id");
        var checks = loadChecks(activePlayer);
        checks[id] = input.checked;
        saveChecks(activePlayer, checks);
        var card = input.closest(".card");
        card.classList.toggle("checked", input.checked);
        renderProgress();
      });
    });
  }

  function bindReset(){
    document.getElementById("resetBtn").addEventListener("click", function(){
      var name = loadName(activePlayer);
      var ok = window.confirm(name + " の記録をリセットしますか？（チェックが全て消えます）");
      if(ok){
        saveChecks(activePlayer, {});
        renderChecks();
        renderProgress();
      }
    });
  }

  renderTabNames();
  bindTabs();
  bindCards();
  bindReset();
  switchPlayer("p1");
})();
</script>

</body>
</html>
